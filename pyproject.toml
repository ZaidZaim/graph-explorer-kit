[project]
name = "demo-neo4j-graphrag"
version = "0.1.0"
description = "Reusable GraphRAG-on-Neo4j scaffold: schema-driven ingestion, graph retrieval, and an interactive explorer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
dependencies = [
    "neo4j>=5.28.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "neo4j-graphrag[experimental,openai]>=1.19.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0"]

[project.scripts]
graphrag-setup = "graphrag_kit.setup_indexes:main"
graphrag-ingest = "graphrag_kit.ingest:main"
graphrag-ask = "graphrag_kit.ask:main"
graphrag-serve = "graphrag_kit.server:main"
graphrag-reset = "graphrag_kit.reset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_kit", "projects"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
