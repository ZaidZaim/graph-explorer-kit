[project]
name = "demo-neo4j-graphrag"
version = "0.1.0"
description = "Reusable GraphRAG-on-Neo4j scaffold: schema-driven ingestion, graph retrieval, and an interactive explorer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
dependencies = [
    "neo4j>=5.28.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    # FastAPI needs this for multipart form data — the document upload endpoint.
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32.0",
    # neo4j-graphrag's [openai] and [experimental] extras both pin openai<2 (the
    # latter transitively, through llama-index), and agent-framework-openai needs
    # openai>=2.25. The extras are therefore unbundled: openai is pinned directly
    # at 2.x, and langchain-text-splitters — the only part of [experimental] this
    # scaffold uses — is declared on its own. That drops llama-index and neo4j-viz,
    # neither of which is imported anywhere here.
    "neo4j-graphrag>=1.19.0",
    "langchain-text-splitters>=0.3.0",
    "openai>=2.25.0",
    "agent-framework-openai>=1.14.1",
    "azure-identity>=1.25.3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9.0", "pytest>=8.3.0"]

[project.scripts]
graphrag-setup = "graphrag_kit.setup_indexes:main"
graphrag-adopt = "graphrag_kit.adopt:main"
graphrag-ingest = "graphrag_kit.ingest:main"
graphrag-ask = "graphrag_kit.ask:main"
graphrag-agent = "graphrag_kit.agent:main"
graphrag-serve = "graphrag_kit.server:main"
graphrag-reset = "graphrag_kit.reset:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_kit", "projects"]

[tool.pytest.ini_options]
# The tests cover the pure parts — the Cypher the engine builds from a spec, and
# the spec's own invariants. Nothing here touches a database or a model.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
